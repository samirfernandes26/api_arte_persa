name: Docker Build e Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Altere para o nome final da imagem no Docker Hub.
  IMAGEM_DOCKER: SEU_USUARIO_DOCKERHUB/api-arte-persa

jobs:
  publicar-imagem:
    name: Publicar Imagem Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Fazer login no Docker Hub
        uses: docker/login-action@v4
        with:
          # Crie estes secrets no repositorio antes de ativar o workflow.
          username: ${{ secrets.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar metadados das tags
        id: metadados
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM_DOCKER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Buildar e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadados.outputs.tags }}
          labels: ${{ steps.metadados.outputs.labels }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build
